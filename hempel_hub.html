<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#EEF4FB;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:440px;text-align:center}
.logo{margin:0 auto 44px;max-width:260px}
.logo img{width:100%;height:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.erp-card{background:#fff;border:1.5px solid #C8D9EE;border-radius:16px;padding:28px 20px 24px;cursor:pointer;transition:all .18s;text-decoration:none;display:block}
.erp-card:hover{border-color:#0D3A6E;box-shadow:0 6px 20px rgba(13,58,110,.13);transform:translateY(-2px)}
.card-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
.card-icon.blue{background:#D6E6F7;color:#1A5FA8}
.card-icon.teal{background:#DCF0E3;color:#1A6835}
.card-main{font-size:17px;font-weight:700;color:#0F2342;margin-bottom:3px}
.card-sub{font-size:12px;color:#7A96B5;font-weight:400}
.footer{margin-top:32px;font-size:11px;color:#A8C2E0}
</style>
